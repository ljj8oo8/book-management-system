<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>编辑用户 - 图书管理系统</title>
    <script src="../../assets/js/vue.global.prod.js"></script>
    <link href="../../assets/css/bootstrap.min.css" rel="stylesheet">
    <link href="../../assets/css/font-awesome.min.css" rel="stylesheet">
    <script src="../../assets/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/axios.min.js"></script>
    <script src="../../assets/config.js"></script>
    <script src="../../assets/js/api.js"></script>
    <script src="../../assets/js/auth.js"></script>
    <style>
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .content {
            flex: 1;
            padding: 20px 0;
        }
        .sidebar {
            min-height: calc(100vh - 56px);
            background-color: #f8f9fa;
            padding-top: 20px;
        }
        .navbar-brand {
            font-weight: bold;
        }
        .active-menu {
            background-color: #0d6efd;
            color: white !important;
        }
        .form-card {
            border: 1px solid #eee;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
<div id="app">
    <!-- 头部导航 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/index">
                <i class="fa fa-book"></i> 图书管理系统
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item" v-if="isLogin">
                            <span class="nav-link">
                                <i class="fa fa-user"></i> {{ username }}
                            </span>
                    </li>
                    <li class="nav-item" v-if="isLogin">
                        <a class="nav-link" href="#" @click="logout">
                            <i class="fa fa-sign-out"></i> 退出登录
                        </a>
                    </li>
                    <li class="nav-item" v-else>
                        <a class="nav-link" href="/login">
                            <i class="fa fa-sign-in"></i> 登录
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- 主体内容 -->
    <div class="container-fluid">
        <div class="row">
            <!-- 侧边栏 -->
            <div class="col-md-2 sidebar p-0">
                <div class="list-group list-group-flush">
                    <a href="/views/index.html" class="list-group-item list-group-item-action active-menu">
                        <i class="fa fa-home"></i> 系统首页
                    </a>
                    <a href="/views/book/list.html" class="list-group-item list-group-item-action" v-if="isAdmin">
                        <i class="fa fa-book"></i> 图书管理
                    </a>
                    <a href="/views/user/list.html" class="list-group-item list-group-item-action" v-if="isAdmin">
                        <i class="fa fa-users"></i> 用户管理
                    </a>
                    <a href="/views/log/list.html" class="list-group-item list-group-item-action" v-if="isAdmin">
                        <i class="fa fa-history"></i> 操作日志
                    </a>
                </div>
            </div>

            <!-- 主内容区 -->
            <div class="col-md-10 content">
                <div class="container">
                    <!-- 权限不足提示 -->
                    <div class="alert alert-danger mt-3" v-if="!isAdmin && isLogin">
                        <i class="fa fa-exclamation-triangle"></i> 您没有权限编辑用户
                    </div>

                    <!-- 用户编辑卡片（仅管理员可见） -->
                    <div class="card shadow-sm mt-3" v-if="isAdmin && userId">
                        <div class="card-header bg-primary text-white">
                            <h5 class="mb-0"><i class="fa fa-edit"></i> 编辑用户</h5>
                        </div>
                        <div class="card-body">
                            <!-- 提示信息 -->
                            <div class="alert alert-danger" v-if="errorMsg" role="alert">
                                {{ errorMsg }}
                            </div>
                            <div class="alert alert-success" v-if="successMsg" role="alert">
                                {{ successMsg }}
                            </div>

                            <!-- 编辑用户表单 -->
                            <form @submit.prevent="submitEdit" v-if="userForm.id">
                                <div class="form-card">
                                    <h6 class="mb-3 text-secondary"><i class="fa fa-user-circle"></i> 基本信息</h6>
                                    <div class="row mb-3">
                                        <div class="col-md-6">
                                            <label for="username" class="form-label">用户名 <span class="text-danger">*</span></label>
                                            <input type="text" class="form-control" id="username" v-model="userForm.username"
                                                   required placeholder="请输入用户名" disabled>
                                            <div class="form-text">用户名不可修改</div>
                                        </div>
                                        <div class="col-md-6">
                                            <label for="nickname" class="form-label">昵称</label>
                                            <input type="text" class="form-control" id="nickname" v-model="userForm.nickname"
                                                   placeholder="请输入用户昵称（可选）">
                                        </div>
                                    </div>

                                    <div class="row mb-3">
                                        <div class="col-md-6">
                                            <label for="password" class="form-label">密码</label>
                                            <input type="password" class="form-control" id="password" v-model="userForm.password"
                                                   placeholder="不修改密码请留空">
                                            <div class="form-text">密码长度不少于6位</div>
                                        </div>
                                        <div class="col-md-6">
                                            <label for="roleCode" class="form-label">用户角色 <span class="text-danger">*</span></label>
                                            <select class="form-select" id="roleCode" v-model="userForm.roleCode" required>
                                                <option value="ROLE_USER">普通用户</option>
                                                <option value="ROLE_ADMIN">管理员</option>
                                            </select>
                                        </div>
                                    </div>

                                    <div class="mb-3">
                                        <label for="status" class="form-label">用户状态 <span class="text-danger">*</span></label>
                                        <select class="form-select" id="status" v-model="userForm.status" required>
                                            <option value="1">启用</option>
                                            <option value="0">禁用</option>
                                        </select>
                                    </div>
                                </div>

                                <div class="d-flex justify-content-between">
                                    <a href="/views/user/list" class="btn btn-outline-secondary">
                                        <i class="fa fa-arrow-left"></i> 返回列表
                                    </a>
                                    <button type="submit" class="btn btn-primary" :disabled="loading">
                                        <i class="fa fa-save"></i> {{ loading ? '保存中...' : '保存修改' }}
                                    </button>
                                </div>
                            </form>

                            <!-- 加载中提示 -->
                            <div class="text-center py-5" v-else>
                                <div class="spinner-border text-primary" role="status">
                                    <span class="visually-hidden">Loading...</span>
                                </div>
                                <p class="mt-2 text-muted">加载用户信息中...</p>
                            </div>
                        </div>
                    </div>

                    <!-- 用户ID不存在提示 -->
                    <div class="alert alert-warning mt-3" v-if="isAdmin && !userId">
                        <i class="fa fa-exclamation-triangle"></i> 未找到指定用户，请返回列表页重试
                    </div>

                    <!-- 未登录提示 -->
                    <div class="alert alert-warning mt-3" v-if="!isLogin">
                        <i class="fa fa-exclamation-circle"></i> 请先登录系统后编辑用户
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const { createApp, ref, reactive, onMounted } = Vue;

    createApp({
        setup() {
            // 响应式数据
            const isLogin = ref(false);
            const isAdmin = ref(false);
            const username = ref('');
            const loading = ref(false);
            const errorMsg = ref('');
            const successMsg = ref('');
            const userId = ref('');
            const userForm = reactive({
                id: '',
                username: '',
                nickname: '',
                password: '',
                roleCode: 'ROLE_USER',
                status: 1
            });

            // 从URL获取用户ID
            const getUserIdFromUrl = () => {
                const urlParams = new URLSearchParams(window.location.search);
                const id = urlParams.get('id') || window.location.pathname.split('/').pop();
                userId.value = id;
                return id;
            };

            // 退出登录
            const logout = () => {
                if (confirm('确定要退出登录吗？')) {
                    axios.post(httpurl+'/login/logout')
                        .then(() => {
                            window.location.href = '/views/login.html';
                        })
                        .catch(err => {
                            console.error(err);
                            window.location.href = '/views/login.html';
                        });
                }
            };

            // 获取当前用户信息
            const getCurrentUser = () => {
                axios.get(httpurl+'/user/current')
                    .then(res => {
                        if (res.data.code === 200) {
                            isLogin.value = true;
                            username.value = res.data.data.username;
                            isAdmin.value = res.data.data.roleCode === 'ROLE_ADMIN';
                            // 非管理员跳转到图书列表
                            if (!isAdmin.value) {
                                window.location.href = '/views/list.html';
                            }
                        }
                    })
                    .catch(err => {
                        isLogin.value = false;
                        if (err.response?.status === 401) {
                            window.location.href = '/views/login.html';
                        }
                    });
            };
            // 获取用户详情
            const getUserDetail = () => {
                const id = getUserIdFromUrl();
                if (!id) return;

                axios.get(httpurl+`/user/detail/${id}`)
                    .then(res => {
                        if (res.data.code === 200) {
                            const user = res.data.data;
                            userForm.id = user.id;
                            userForm.username = user.username;
                            userForm.nickname = user.nickname || '';
                            userForm.roleCode = user.roleCode || 'ROLE_USER';
                            userForm.status = user.status || 1;
                            // 密码初始化为空（不回显）
                            userForm.password = '';
                        } else {
                            errorMsg.value = res.data.msg;
                        }
                    })
                    .catch(err => {
                        errorMsg.value = '加载用户信息失败，请重试';
                        console.error(err);
                    });
            };

            // 提交编辑表单
            const submitEdit = () => {
                loading.value = true;
                errorMsg.value = '';
                successMsg.value = '';

                // 表单验证
                if (userForm.password && userForm.password.length < 6) {
                    errorMsg.value = '密码长度不能少于6位';
                    loading.value = false;
                    return;
                }

                // 构建提交数据（密码为空则不提交）
                const submitData = {
                    id: userForm.id,
                    nickname: userForm.nickname,
                    roleCode: userForm.roleCode,
                    status: userForm.status
                };
                if (userForm.password) {
                    submitData.password = userForm.password;
                }

                // 提交请求
                axios.post(httpurl+`/user/edit/${userForm.id}`, submitData)
                    .then(res => {
                        if (res.data.code === 200) {
                            successMsg.value = '修改用户成功！';
                            // 2秒后跳转到列表页
                            setTimeout(() => {
                                window.location.href = '/views/user/list.html';
                            }, 1500);
                        } else {
                            errorMsg.value = res.data.msg;
                        }
                    })
                    .catch(err => {
                        errorMsg.value = '修改用户失败，请检查表单或重试';
                        console.error(err);
                    })
                    .finally(() => {
                        loading.value = false;
                    });
            };

            // 页面加载初始化
            onMounted(() => {
                getCurrentUser();
                // 管理员才加载用户详情
                if (isAdmin.value) {
                    getUserDetail();
                }
            });

            return {
                isLogin,
                isAdmin,
                username,
                loading,
                errorMsg,
                successMsg,
                userId,
                userForm,
                logout,
                submitEdit
            };
        }
    }).mount('#app');
</script>
</body>
</html>
